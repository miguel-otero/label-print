name: Build Windows Print Agent

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/windows_agent/**"
      - "packaging/windows-agent/**"
      - "scripts/powershell/**"
      - "scripts/linux/**"
      - ".github/workflows/windows-agent.yml"
      - ".github/workflows/windows-agent-build.yml"
  push:
    tags:
      - "agent-v*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/windows-agent-build.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-agent-installer
          path: artifacts/windows-agent
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/windows-agent/* --generate-notes --verify-tag
