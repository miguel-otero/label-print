name: Zip Code Solution

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  CONN_VARIABLES: |
    [
      {"path":".env", "var":"ENV_FILE"}
    ]

jobs:
  windows-agent:
    uses: ./.github/workflows/windows-agent-build.yml

  setup-env:
    name: setup-env
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap (jq)
        run: bash scripts/linux/startup.sh -t jq

      - name: Create conn/ files from secrets
        shell: bash
        env:
          ENV_FILE: ${{ vars.ENV_FILE }}
        run: |
          set -euo pipefail

          if [[ -z "${CONN_VARIABLES:-}" ]]; then
            echo "⚠️ CONN_VARIABLES is not defined; nothing to generate."
            exit 0
          fi

          echo "📝 Creating files declared in CONN_VARIABLES"
          mkdir -p conn/

          echo "$CONN_VARIABLES" \
            | jq -r '.[] | "\(.path):\(.var)"' \
            | while IFS=: read -r file varname; do
                if [[ -z "${!varname:-}" ]]; then
                  echo "❌ Secret/variable $varname is not defined"
                  exit 1
                fi
                printf '%s' "${!varname}" > "conn/$file"
                echo "   • conn/$file ← $varname"
              done

      - name: Clean CRLF ( \r )
        run: |
          find conn/ -type f -exec sed -i 's/\r//g' {} +

      - name: Upload conn/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: conn
          path: conn/
          retention-days: 1
          include-hidden-files: true

  update-zip:
    name: update-zip
    runs-on: ubuntu-latest
    needs: [setup-env, windows-agent]

    steps:
      - uses: actions/checkout@v4

      - name: Download installer from this build
        uses: actions/download-artifact@v4
        with:
          name: windows-agent-installer
          path: artifacts/windows-agent

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage verified installer
        shell: bash
        run: |
          set -euo pipefail
          installers=(artifacts/windows-agent/*-x64.exe)
          [[ ${#installers[@]} -eq 1 ]]
          python scripts/prepare_agent_release.py --installer "${installers[0]}"

      - name: Download conn/ artifact
        uses: actions/download-artifact@v4
        with:
          name: conn
          path: conn

      - name: Auth to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Bootstrap (zip)
        run: bash scripts/linux/startup.sh -t zip

      - name: Update zip for prod
        run: bash scripts/linux/update_zip.sh
